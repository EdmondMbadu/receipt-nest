<div class="relative">
  <button #trigger type="button" aria-label="Account menu" [attr.aria-expanded]="open()" aria-controls="help-account-menu"
    (click)="open.set(!open())"
    class="inline-flex h-11 w-11 items-center justify-center rounded-xl bg-gradient-to-br from-emerald-500 to-emerald-600 text-sm font-bold text-white shadow-lg shadow-emerald-500/20 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-600">
    {{ initials() }}
  </button>
  @if (open()) {
    <div id="help-account-menu" aria-label="Account options" class="absolute right-0 z-50 mt-2 w-64 max-w-[calc(100vw-2rem)] overflow-hidden rounded-2xl border border-slate-200 bg-white text-slate-700 shadow-xl dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200">
      <div class="border-b border-slate-100 px-4 py-3 dark:border-slate-800">
        <p class="truncate text-sm font-semibold">{{ name() }}</p>
        <p class="truncate text-xs text-slate-500 dark:text-slate-400">{{ user()?.email }}</p>
      </div>
      @if (user()?.role === 'admin') {
        <a routerLink="/app/admin" (click)="open.set(false)" class="block px-4 py-3 text-sm font-medium text-emerald-700 hover:bg-emerald-50 dark:text-emerald-300 dark:hover:bg-slate-800">Admin</a>
      }
      <button type="button" (click)="settings()" class="block w-full px-4 py-3 text-left text-sm font-medium hover:bg-slate-50 dark:hover:bg-slate-800">Settings</button>
      @if (user()?.stripeCustomerId) {
        <button type="button" (click)="billing()" [disabled]="busy()" class="block w-full px-4 py-3 text-left text-sm font-medium hover:bg-slate-50 disabled:opacity-50 dark:hover:bg-slate-800">Manage billing</button>
      } @else {
        <a routerLink="/app/pricing" (click)="open.set(false)" class="block px-4 py-3 text-sm font-medium hover:bg-slate-50 dark:hover:bg-slate-800">Plans & pricing</a>
      }
      <button type="button" (click)="logout()" [disabled]="busy()" class="block w-full px-4 py-3 text-left text-sm font-medium hover:bg-slate-50 disabled:opacity-50 dark:hover:bg-slate-800">Log out</button>
      @if (error()) { <p role="alert" class="px-4 pb-3 text-sm text-rose-600">{{ error() }}</p> }
    </div>
  }
</div>
